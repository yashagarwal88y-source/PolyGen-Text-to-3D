<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyGen | Generative Text-to-3D Asset Studio</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --border: #dce3ee;
      --text: #182230;
      --muted: #5a6a85;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-bg: #eef4ff;
      --success: #0f766e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--primary);
      border: 1px solid #c7d9fd;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 1.25rem;
      padding: 1.25rem 1.75rem;
      max-width: 1520px;
      width: 100%;
      margin: 0 auto;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.92rem;
      resize: vertical;
      background: #fafcff;
      color: var(--text);
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
    }

    .toggles {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text);
    }

    .toggles label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      margin: 0;
      cursor: pointer;
    }

    button.primary-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.primary-btn:hover { background: var(--primary-hover); }
    button.primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .prompt-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--muted);
      min-height: 70px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .metric-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }

    .metric-card span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .metric-card strong {
      font-size: 0.95rem;
      color: var(--text);
    }

    .viewport-wrapper {
      position: relative;
      padding: 0;
      overflow: hidden;
      min-height: 560px;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      min-height: 560px;
      background: linear-gradient(180deg, #eef3fa 0%, #dde6f3 100%);
    }

    .viewport-toolbar {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .tool-btn:hover { background: #ffffff; border-color: var(--primary); color: var(--primary); }
    .tool-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    .status-banner {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 7px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
  <!-- Import map for Three.js & GLTFLoader / OrbitControls -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <span>PolyGen Studio</span>
      <span class="badge">Text-to-3D Asset Pipeline</span>
    </div>
    <span class="badge" id="backend-badge">Backend: Ready</span>
  </header>

  <main>
    <section class="panel">
      <h2>1. Prompt & Synthesis Controls</h2>
      <div>
        <label for="prompt-input">Describe your 3D asset</label>
        <textarea id="prompt-input" placeholder="e.g., A medieval iron shield with a raised central boss and riveted rim..."></textarea>
      </div>

      <div class="toggles">
        <label><input type="checkbox" id="opt-enhance" checked /> LLM 3D Prompt Expansion</label>
        <label><input type="checkbox" id="opt-normalize" checked /> Auto-Center & Unit Scale Normalization</label>
        <label><input type="checkbox" id="opt-decimate" checked /> Quadric Polygon Decimation (&le;15k faces)</label>
      </div>

      <button class="primary-btn" id="generate-btn">Generate 3D Asset (.GLB)</button>

      <div>
        <label>Enhanced 3D Descriptor</label>
        <div class="prompt-box" id="enhanced-prompt-display">
          Submit a prompt to view the expanded 3D geometry &amp; PBR descriptor.
        </div>
      </div>

      <h2>2. Mesh Topology &amp; Latency</h2>
      <div class="metrics-grid">
        <div class="metric-card"><span>Vertices</span><strong id="metric-verts">—</strong></div>
        <div class="metric-card"><span>Faces</span><strong id="metric-faces">—</strong></div>
        <div class="metric-card"><span>Watertight</span><strong id="metric-watertight">—</strong></div>
        <div class="metric-card"><span>Latency</span><strong id="metric-latency">—</strong></div>
      </div>
    </section>

    <section class="panel viewport-wrapper">
      <div class="viewport-toolbar">
        <button class="tool-btn" id="toggle-wireframe">Wireframe: OFF</button>
        <button class="tool-btn" id="toggle-spin">Auto-Rotate: ON</button>
        <button class="tool-btn" id="reset-camera">Reset View</button>
        <a class="tool-btn" id="download-btn" href="#" download style="display: none;">Download .GLB</a>
      </div>
      <div id="canvas-container"></div>
      <div class="status-banner" id="status-text">Viewport ready. Drag to orbit, scroll to zoom.</div>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
